name: Validate and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run test:examples
      - run: python -m pip install -r docs/requirements-learning.txt
      - run: npm run test:guides
      - run: npm run docs:curriculum && git diff --exit-code -- docs/curriculum
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          trap 'cat /tmp/vite.log' EXIT
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5188/ && break || sleep 1; done
          npm run test:curriculum
          npm run test:daily
          npm run test:solutions
          npm run test:runner
          npm run test:contracts
          npm run test:guides:browser
          npm run test:smoke
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
